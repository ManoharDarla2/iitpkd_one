name: ilab_connect
description: "ILab Connect - Campus Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  better_auth_flutter: ^0.0.7
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.7+1
  flutter_hooks: ^0.21.3+1
  go_router: ^17.1.0
  google_sign_in: ^6.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.5.0
  hooks_riverpod: ^3.2.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/map_bg.png
    - assets/images/app_icon_light.png
    - assets/images/app_icon_dark.png
